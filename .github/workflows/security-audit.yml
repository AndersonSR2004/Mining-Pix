name: Mining Pix Dependency Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/mining-pix-work]
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mining Pix
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mining Pix/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Report known vulnerabilities
        run: npm audit --audit-level=high
