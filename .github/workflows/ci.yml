name: Mining Pix CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/mining-pix-work]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mining Pix
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mining Pix/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test pool allocation
        run: npm test
      - name: Type-check and build
        run: npm run build
